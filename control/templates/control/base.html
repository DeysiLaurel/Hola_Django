{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8fafc">
    <meta name="description" content="Panel de control de Django con MariaDB">
    <title>{% block title %}Django 6 con MariaDB 11{% endblock %}</title>
    <link rel="icon" href="{% static 'control/img/hola.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"]
                    }
                }
            }
        };
    </script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">
    <div class="pointer-events-none fixed inset-x-0 top-0 -z-10 h-96 bg-gradient-to-b from-indigo-100/70 via-slate-50 to-transparent"></div>
    <header class="sticky top-0 z-20 border-b border-slate-200/80 bg-white/80 backdrop-blur-xl">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8" aria-label="Navegación principal">
            <a href="{% url 'home' %}" class="group flex items-center gap-3 rounded-xl focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-lg font-bold text-white shadow-lg shadow-indigo-600/20 transition duration-300 group-hover:scale-105">D</span>
                <span>
                    <span class="block text-sm font-bold tracking-tight text-slate-900">Django Panel</span>
                    <span class="block text-xs text-slate-500">MariaDB 11</span>
                </span>
            </a>
            <div class="flex items-center gap-2 sm:gap-4">
                <a href="{% url 'home' %}" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition duration-200 hover:bg-slate-100 hover:text-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500">Panel</a>
                <a href="{% url 'admin:index' %}" class="rounded-lg bg-slate-900 px-3.5 py-2 text-sm font-semibold text-white shadow-sm transition duration-200 hover:scale-[1.02] hover:bg-indigo-700 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2">Administración</a>
            </div>
        </nav>
        {% block cabeza %}{% endblock %}
    </header>

    <main class="mx-auto w-full max-w-7xl px-4 py-10 sm:px-6 sm:py-14 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-slate-200/80 bg-white/70">
        <div class="mx-auto flex max-w-7xl flex-col gap-2 px-4 py-6 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-6 lg:px-8">
            <span>&copy; {% now "Y" %} Django Panel</span>
            <span>Desarrollado con Django y MariaDB</span>
        </div>
        {% block patitas %}{% endblock %}
    </footer>
</body>
</html>
